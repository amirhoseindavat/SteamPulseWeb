<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting — SteamPulse</title>
    <script>
      (function () {
        var projectBase = "/SteamPulseWeb/";
        var base = window.location.pathname.startsWith(projectBase) ? projectBase : "/";
        var route = window.location.pathname.slice(base.length - 1) || "/";
        var destination = base + "?p=" + encodeURIComponent(route + window.location.search + window.location.hash);
        window.location.replace(destination);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to SteamPulse…</p>
  </body>
</html>
